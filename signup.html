<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rover Buddies – Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="logo">🚀</div>
    <h1>Join Galaxy Kids</h1>
    <p class="subtitle">Create your account!</p>

    <form id="signupForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="astronaut@galaxy.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required />
          <button type="button" class="toggle" id="togglePw">Show</button>
        </div>
      </div>
      <button type="submit" class="btn">Create Account ✨</button>
      <p class="message" id="message" role="alert"></p>
    </form>

    <p class="footer">Already have an account? <a href="index.html">Log in</a></p>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
